<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>誰在聽？誰在彈？——畫中「聽琴」的兩種傳統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f9f8f4;
      --card-bg: #fcfbf9;
      --subtle-bg: #f2efe9;
      --ink: #2c2c2c;
      --ink-secondary: #595959;
      --muted: #7a7a7a;
      --line: #3d3b38;
      --line-light: #dcd8d0;
      --accent: #9c3030;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: 'Noto Serif TC', "Songti TC", "SimSun", serif;
      line-height: 1.9;
      padding: 24px 20px 60px;
    }

    /* 置頂導覽列（滾動時固定於上方，方便隨時跳轉） */
    nav {
      position: sticky;
      top: 12px;
      z-index: 100;
      max-width: 960px;
      margin: 0 auto 24px;
      padding: 12px 20px;
      background-color: rgba(252, 251, 249, 0.96);
      border: 1px solid var(--line);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 24px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
    }

    nav a {
      color: var(--ink-secondary);
      text-decoration: none;
    }

    nav a:hover {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .deck-container {
      max-width: 960px;
      margin: 0 auto;
      border: 1.5px solid var(--line);
      background: var(--card-bg);
      padding: 60px;
      box-shadow: 10px 10px 0px var(--line-light);
    }

    header {
      border-bottom: 1.5px solid var(--line);
      padding-bottom: 40px;
      margin-bottom: 52px;
    }

    .badge {
      display: inline-block;
      font-family: 'Noto Sans TC', sans-serif;
