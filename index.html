<html lang="zh-Hant">

  <style>
    :root {
      /* 主背景與卡片底色（米白與淺灰） */
      --paper: #f9f8f4;
      --card-bg: #fcfbf9;
      --subtle-bg: #f2efe9;

      /* 文字顏色（炭黑與深灰，高對比易讀） */
      --ink: #2c2c2c;
      --ink-secondary: #595959;
      --muted: #7a7a7a;

      /* 框線與低飽和度傳統點綴色 */
      --line: #3d3b38;
      --line-light: #dcd8d0;
      --accent: #9c3030; /* 硃砂紅（可替換為 暗青色 #3b5e5c 或 茶褐色 #73503c） */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: 'Noto Serif TC', "Songti TC", "SimSun", serif;
      line-height: 1.9;
      padding: 40px 20px;
    }

    /* 頂部極簡導覽列 */
    nav {
      max-width: 960px;
      margin: 0 auto 24px;
      padding: 12px 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--line);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 24px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
    }

    nav a {
      color: var(--ink-secondary);
      text-decoration: none;
    }

    nav a:hover {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* 主展覽外框 */
    .deck-container {
      max-width: 960px;
      margin: 0 auto;
      border: 1.5px solid var(--line);
      background: var(--card-bg);
      padding: 60px;
      box-shadow: 10px 10px 0px var(--line-light);
    }
